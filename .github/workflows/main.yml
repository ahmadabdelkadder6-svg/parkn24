name: Daily Supabase Backup to Releases

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. تثبيت أدوات PostgreSQL 17 الأحدث
      - name: Install PostgreSQL 17 Tools
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc &>/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      # 2. سحب البيانات
      - name: Backup Database
        run: |
          DATE=$(date +'%Y-%m-%d_%H-%M')
          echo "TAG_NAME=backup-$DATE" >> $GITHUB_ENV
          echo "FILE_NAME=supabase_backup_$DATE.sql" >> $GITHUB_ENV
          
          pg_dump "${{ secrets.DATABASE_URL }}" > "supabase_backup_$DATE.sql"

      # 3. رفع الملف إلى Releases
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "نسخة احتياطية بتاريخ ${{ env.TAG_NAME }}"
          files: ${{ env.FILE_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
