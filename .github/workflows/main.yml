name: Daily Supabase Backup to Releases

on:
  schedule:
    # يعمل تلقائياً كل يوم منتصف الليل بتوقيت جرينتش
    - cron: '0 0 * * *'
  workflow_dispatch: # زر للتشغيل اليدوي في أي وقت

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write # للسماح برفع النسخة إلى Releases

    steps:
      # 1. تثبيت أداة PostgreSQL
      - name: Install PostgreSQL Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # 2. سحب البيانات وضغطها
      - name: Backup Database
        run: |
          DATE=$(date +'%Y-%m-%d_%H-%M')
          echo "TAG_NAME=backup-$DATE" >> $GITHUB_ENV
          echo "FILE_NAME=supabase_backup_$DATE.sql.gz" >> $GITHUB_ENV
          
          # أخذ النسخة وضغطها لتكون بحجم صغير جداً
          pg_dump "${{ secrets.DATABASE_URL }}" | gzip > "supabase_backup_$DATE.sql.gz"

      # 3. رفع الملف مباشرة إلى GitHub Releases (حفظ دائم)
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "نسخة احتياطية بتاريخ ${{ env.TAG_NAME }}"
          files: ${{ env.FILE_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
