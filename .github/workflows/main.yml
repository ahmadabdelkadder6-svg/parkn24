name: Daily Supabase Backup to Releases

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Install PostgreSQL Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Backup Database
        run: |
          DATE=$(date +'%Y-%m-%d_%H-%M')
          echo "TAG_NAME=backup-$DATE" >> $GITHUB_ENV
          echo "FILE_NAME=supabase_backup_$DATE.sql" >> $GITHUB_ENV
          
          # حفظ الملف كـ SQL عادي ومباشر بدون ضغط
          pg_dump "${{ secrets.DATABASE_URL }}" > "supabase_backup_$DATE.sql"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "نسخة احتياطية بتاريخ ${{ env.TAG_NAME }}"
          files: ${{ env.FILE_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
